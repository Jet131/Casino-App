<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sal's Club</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sal's Club">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#241A2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FFF3DC;
  --paper-deep: #F5E3B3;
  --felt: #146B3A;
  --felt-deep: #0D4E29;
  --felt-dark: #073019;
  --red: #C8203A;
  --red-deep: #8F1228;
  --gold: #F5C542;
  --gold-deep: #C89B2C;
  --gold-bright: #FFE08A;
  --ink: #2B1B12;
  --ink-soft: #6B5A46;
  --white: #FFFDF6;
  --velvet: #5C1626;
  --card-shadow: 0 6px 0 rgba(43,27,18,0.28);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #150F1A; }
body { font-family: 'Nunito', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
.disp { font-family: 'Fredoka', sans-serif; }

#root { display: flex; justify-content: center; height: 100vh; height: 100dvh; }
.app {
  width: 100%; max-width: 480px; height: 100vh; height: 100dvh; background: var(--paper);
  display: flex; flex-direction: column; position: relative; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  box-shadow: 0 0 60px rgba(0,0,0,0.35);
}
.app.sal-aura::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 997;
  box-shadow: inset 0 0 30px 4px rgba(245,197,66,0.22);
  animation: aura-pulse 3.5s ease-in-out infinite;
}
@keyframes aura-pulse {
  0%, 100% { box-shadow: inset 0 0 30px 4px rgba(245,197,66,0.18); }
  50% { box-shadow: inset 0 0 48px 9px rgba(245,197,66,0.4); }
}

/* header */
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; flex-shrink: 0; background: linear-gradient(180deg, var(--felt-dark), var(--felt-deep)); border-bottom: 4px solid var(--gold); }
.wordmark { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: var(--gold-bright); letter-spacing: -0.02em; display: flex; align-items: center; gap: 3px; text-shadow: 2px 2px 0 var(--red-deep); position: relative; overflow: hidden; background: linear-gradient(100deg, var(--gold-bright) 40%, #FFFFFF 50%, var(--gold-bright) 60%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: wordmark-shine 5s ease-in-out infinite; }
@keyframes wordmark-shine { 0%, 20% { background-position: 100% 0; } 60%, 100% { background-position: -60% 0; } }
.wordmark .dot { color: var(--red); text-shadow: none; -webkit-text-fill-color: var(--red); background: none; }
.wordmark .legacy-crown { -webkit-text-fill-color: initial; background: none; font-size: 15px; }
.top-right { display: flex; align-items: center; gap: 8px; }

.wallet-pill {
  display: flex; align-items: center; gap: 6px; background: linear-gradient(180deg, var(--gold), var(--gold-deep));
  border: 3px solid var(--ink); border-radius: 999px; padding: 6px 14px 6px 8px;
  font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; color: var(--ink);
  box-shadow: 0 3px 0 var(--red-deep);
  transform: scale(1); transition: transform 0.15s ease;
}
.wallet-pill.pop-win { animation: coin-pop-win 0.5s ease; }
.wallet-pill.pop-lose { animation: coin-pop-lose 0.5s ease; }
.coin-ico {
  display: inline-block; width: 0.95em; height: 0.95em; border-radius: 50%; flex-shrink: 0;
  background: radial-gradient(circle at 32% 26%, #FFF3C4, #F5C542 55%, #C89B2C 100%);
  border: 0.07em solid #8A6A1C;
  box-shadow: inset 0 0.06em 0.05em rgba(255,255,255,0.7), inset 0 -0.06em 0.05em rgba(0,0,0,0.3);
  vertical-align: -0.14em; position: relative;
}
.coin-ico::after {
  content: ''; position: absolute; inset: 20%; border-radius: 50%;
  border: 0.055em solid rgba(138,106,28,0.5);
  box-shadow: inset 0 0.03em 0.03em rgba(255,255,255,0.35);
}
.coin-ico.diamond {
  background: radial-gradient(circle at 32% 26%, #FFFFFF, #B9F2FF 45%, #6FD4E8 80%, #3FA8C4 100%);
  border-color: #2C7A94;
}
.coin-ico.diamond::after { border-color: rgba(44,122,148,0.55); box-shadow: inset 0 0.03em 0.03em rgba(255,255,255,0.6); }
@keyframes coin-pop-win {
  0% { transform: scale(1); }
  30% { transform: scale(1.22) rotate(-4deg); }
  55% { transform: scale(0.96) rotate(3deg); }
  100% { transform: scale(1); }
}
@keyframes coin-pop-lose {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-4px) rotate(-2deg); }
  40% { transform: translateX(4px) rotate(2deg); }
  60% { transform: translateX(-3px) rotate(-1deg); }
  80% { transform: translateX(3px) rotate(1deg); }
}
.coin-icon { font-size: 17px; line-height: 1; }

.gear-btn {
  width: 36px; height: 36px; border-radius: 50%; background: var(--felt-deep); border: 3px solid var(--gold);
  display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; color: var(--gold-bright);
  box-shadow: 0 3px 0 var(--ink); transition: transform 0.15s ease;
}
.gear-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

.content { flex: 1; overflow-y: auto; padding: 10px 16px 16px; -webkit-overflow-scrolling: touch; }

/* bottom nav */
.bottom-nav { display: flex; background: linear-gradient(180deg, var(--felt-deep), var(--felt-dark)); border-top: 4px solid var(--gold); flex-shrink: 0; padding: 6px 2px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 1px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.nav-btn { flex: 1 1 0; min-width: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; color: rgba(255,253,246,0.55); font-family: 'Fredoka', sans-serif; font-size: 8.3px; font-weight: 600; letter-spacing: 0.01em; text-transform: uppercase; cursor: pointer; padding: 6px 0 4px; border-radius: 12px; transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease; white-space: nowrap; }
.nav-btn .nav-icon { font-size: 18px; transition: transform 0.15s ease; }
.nav-btn.active { color: var(--gold-bright); background: rgba(245,197,66,0.16); }
.nav-btn.active .nav-icon { transform: translateY(-2px) scale(1.12); }
.nav-btn:active { transform: scale(0.92); }

/* generic card / board */
.board-card {
  border: 4px solid var(--ink); border-radius: 24px; padding: 16px;
  box-shadow: var(--card-shadow); position: relative; overflow: hidden; margin-bottom: 14px;
}
.board-card::before {
  content: ''; position: absolute; inset: 8px; border: 2px dashed rgba(245,197,66,0.55); border-radius: 18px; pointer-events: none;
}
.board-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px; color: var(--white); text-transform: uppercase; letter-spacing: 0.08em; text-align: center; margin-bottom: 10px; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }
.corner-rivet { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--gold); border: 2px solid var(--ink); z-index: 2; animation: rivet-glint 3.2s ease-in-out infinite; }

/* tier-reactive board treatment: the club gets flashier as you renovate */
.app.tier-2 .board-card, .app.tier-3 .board-card {
  box-shadow: var(--card-shadow), 0 0 18px 2px rgba(245,197,66,0.28);
}
.app.tier-4 .board-card, .app.tier-5 .board-card {
  border-color: var(--gold); box-shadow: var(--card-shadow), 0 0 26px 5px rgba(245,197,66,0.5);
  animation: trim-glow 2.6s ease-in-out infinite, neon-board-pulse 2.4s ease-in-out infinite;
}
@keyframes neon-board-pulse {
  0%, 100% { box-shadow: var(--card-shadow), 0 0 20px 3px rgba(245,197,66,0.4); }
  50% { box-shadow: var(--card-shadow), 0 0 34px 8px rgba(245,197,66,0.8); }
}
.app.tier-4 .board-title, .app.tier-5 .board-title {
  color: var(--gold-bright); text-shadow: 0 0 8px rgba(245,197,66,0.8), 0 2px 0 rgba(0,0,0,0.3);
}
.app.tier-5 .board-card::before { border-color: rgba(255,224,138,0.8); animation: corner-twinkle 2s ease-in-out infinite; }
.app.tier-3 .bulb, .app.tier-4 .bulb, .app.tier-5 .bulb { box-shadow: 0 0 6px 2px rgba(255,224,138,0.7); }
.app.tier-5 .bulb { animation-duration: 0.7s; }

/* Penthouse-exclusive: the game pieces themselves go black-and-gold */
.app.tier-5 .pcard {
  background: linear-gradient(160deg, #241C36, #0A0812); border-color: var(--gold-bright);
  box-shadow: 0 3px 0 rgba(0,0,0,0.5), 0 0 10px 2px rgba(245,197,66,0.4);
}
.app.tier-5 .pcard.black { color: var(--gold-bright); text-shadow: 0 0 4px rgba(245,197,66,0.6); }
.app.tier-5 .pcard.red { color: #FF7A96; text-shadow: 0 0 4px rgba(255,122,150,0.5); }
.app.tier-5 .pcard.back { background: repeating-linear-gradient(45deg, #1B1420 0 6px, #2E2154 6px 12px); border-color: var(--gold-bright); }
.app.tier-5 .die { background: linear-gradient(160deg, #241C36, #0A0812); border-color: var(--gold-bright); }
.app.tier-5 .die-pip.on { background: var(--gold-bright); box-shadow: 0 0 3px 1px rgba(245,197,66,0.7); }
.app.tier-5 .chip-btn .chip-face { box-shadow: inset 0 0 0 2px rgba(245,197,66,0.5), 0 0 8px 2px rgba(245,197,66,0.35); }
.app.tier-5 .coin-ico { box-shadow: 0 0 6px 2px rgba(245,197,66,0.5); }
.app.tier-5 .tcard.rarity-common, .app.tier-5 .tcard.rarity-uncommon { box-shadow: 0 4px 0 rgba(0,0,0,0.4), 0 0 8px 1px rgba(245,197,66,0.35); }

.corner-rivet.tr, .corner-rivet.bl { animation-delay: 0.8s; }
@keyframes rivet-glint { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 6px 2px rgba(245,197,66,0.65); } }
.corner-rivet.tl { top: 6px; left: 6px; } .corner-rivet.tr { top: 6px; right: 6px; }
.corner-rivet.bl { bottom: 6px; left: 6px; } .corner-rivet.br { bottom: 6px; right: 6px; }

/* lobby */
.lobby-hero { text-align: center; padding: 10px 8px 18px; }
.lobby-hero-amount { font-family: 'Fredoka', sans-serif; font-size: 40px; font-weight: 700; color: var(--felt-deep); line-height: 1; }
.lobby-hero-label { font-size: 12px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
.lobby-empire-badge { display: inline-block; margin-top: 8px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 11px; color: var(--felt-deep); background: rgba(20,107,58,0.12); border: 2px solid var(--felt-deep); border-radius: 10px; padding: 4px 10px; }
.lobby-empire-badge .prestige-star-row { color: var(--gold-deep); text-shadow: none; font-size: 11px; }
.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.game-card {
  border: 4px solid var(--ink); border-radius: 22px; padding: 16px 10px 14px; text-align: center; cursor: pointer;
  box-shadow: var(--card-shadow); transition: transform 0.12s ease, box-shadow 0.12s ease; position: relative;
}
.game-card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.game-card-emoji { font-size: 36px; display: block; margin-bottom: 6px; animation: idle-bob 3s ease-in-out infinite; }
.game-card-name { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: var(--white); text-shadow: 0 2px 0 rgba(0,0,0,0.22); }
.game-card-sub { font-size: 10px; font-weight: 800; color: rgba(255,255,255,0.85); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
@keyframes idle-bob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-4px) rotate(-4deg); } }

/* bet tray */
.bet-tray { background: var(--white); border: 4px solid var(--ink); border-radius: 20px; padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--card-shadow); }
.bet-tray-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.bet-tray-label { font-family: 'Fredoka', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.bet-amount { font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: var(--felt-deep); }
.chip-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-top: 4px; }
.chip-btn {
  position: relative; width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 var(--ink), inset 0 -3px 0 rgba(0,0,0,0.18), inset 0 2px 0 rgba(255,255,255,0.3);
  transition: transform 0.12s ease, box-shadow 0.12s ease; flex-shrink: 0; padding: 0; margin-bottom: 5px;
  background: repeating-conic-gradient(var(--ring-color, var(--gold)) 0deg 13deg, var(--white) 13deg 19deg);
}
.chip-btn::before {
  content: ''; position: absolute; top: 12%; left: 20%; width: 34%; height: 20%; border-radius: 50%;
  background: rgba(255,255,255,0.6); filter: blur(1.5px); transform: rotate(-18deg); pointer-events: none;
}
.chip-btn::after {
  content: ''; position: absolute; left: 9%; bottom: -5px; width: 82%; height: 82%; border-radius: 50%;
  background: var(--ring-color, var(--gold)); border: 3px solid var(--ink); z-index: -1; opacity: 0.85;
}
.chip-btn:active { transform: translateY(3px) scale(0.94); box-shadow: 0 1px 0 var(--ink); }
.chip-face {
  position: absolute; inset: 7px; border-radius: 50%; background: var(--white); border: 2px solid var(--ink);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.chip-glyph { position: absolute; font-size: 20px; opacity: 0.28; color: var(--face-color, var(--ink)); transform: translateY(-1px); }
.chip-value { position: relative; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 11px; color: var(--face-color, var(--ink)); z-index: 1; text-shadow: 0 1px 0 rgba(255,255,255,0.6); }
.chip-btn.clear-btn { background: var(--white); }
.chip-btn.clear-btn::after { display: none; }
.chip-btn.clear-btn::before { background: rgba(255,255,255,0.35); }
.chip-btn.clear-btn .chip-face { font-size: 9px; color: var(--ink-soft); border: none; inset: 0; }
.chip-btn.all-in-btn { background: repeating-conic-gradient(var(--red) 0deg 13deg, var(--gold-bright) 13deg 19deg); }
.chip-btn.all-in-btn::after { background: var(--red); }
.chip-btn.all-in-btn .chip-face {
  font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 8px; line-height: 1.15;
  color: var(--red-deep); border: none; inset: 0; text-align: center;
}
.chip-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.chip-btn:disabled::after { opacity: 0.4; }


.action-btn {
  width: 100%; padding: 15px; border-radius: 18px; border: 4px solid var(--ink); cursor: pointer;
  font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.02em; color: var(--ink);
  background: linear-gradient(180deg, var(--gold), var(--gold-deep)); box-shadow: 0 5px 0 var(--red-deep);
  transition: transform 0.1s ease, box-shadow 0.1s ease; text-transform: uppercase;
}
.action-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--red-deep); }
.action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.action-btn.cashout { background: linear-gradient(180deg, var(--red), var(--red-deep)); color: var(--white); box-shadow: 0 5px 0 var(--felt-deep); }
.action-btn.cashout:active { box-shadow: 0 1px 0 var(--felt-deep); }

.result-banner {
  text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; padding: 12px;
  border-radius: 16px; border: 3px solid var(--ink); margin-bottom: 12px; animation: banner-in 0.35s cubic-bezier(.2,1.4,.4,1);
}
.result-banner.win { background: var(--gold); color: var(--ink); }
.result-banner.lose { background: var(--red); color: var(--white); }
@keyframes banner-in { 0% { opacity: 0; transform: translateY(-10px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

/* confetti */
.confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden; }
.confetti-bit { position: absolute; width: 9px; height: 9px; border-radius: 2px; animation: confetti-fall 1.1s ease-out forwards; }
@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translateY(140px) rotate(400deg) scale(0.5); opacity: 0; }
}

/* ===== Roulette ===== */
.wheel-wrap { display: flex; justify-content: center; padding: 8px 0 14px; position: relative; }
.wheel-rim { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 218px; height: 218px; border-radius: 50%; border: 6px solid var(--gold); box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 3px var(--gold-bright); pointer-events: none; }
.wheel-deflector-ring { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 218px; height: 218px; pointer-events: none; z-index: 2; }
.wheel-deflector { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF3C4, var(--gold-bright) 60%, var(--gold-deep)); border: 1px solid var(--ink); box-shadow: 0 0 4px 1px rgba(255,224,138,0.6); }
.roulette-history { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-top: 4px; padding-bottom: 4px; }
.roulette-history-chip { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 9px; animation: card-deal 0.25s ease; }
.wheel-pointer { position: absolute; top: -4px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 16px; height: 16px; background: var(--gold-bright); border: 2px solid var(--ink); z-index: 3; }
.wheel-svg { transition: transform 4s cubic-bezier(0.12, 0.75, 0.15, 1); }
.bet-type-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
.bet-type-chip {
  padding: 8px 12px; border-radius: 14px; border: 3px solid var(--ink); cursor: pointer;
  font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase;
  background: var(--white); color: var(--ink); transition: transform 0.12s ease;
}
.bet-type-chip.active { background: var(--gold); color: var(--ink); position: relative; }
.bet-type-chip.active::after { content: ''; position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF3C4, #F5C542 55%, #C89B2C 100%); border: 1.5px solid var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
.bet-type-chip:active { transform: scale(0.94); }
.number-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 10px; }
.number-cell {
  aspect-ratio: 1; border-radius: 8px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center;
  font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 11px; color: var(--white); cursor: pointer; transition: transform 0.1s ease;
}
.number-cell.active { outline: 3px solid var(--gold-bright); outline-offset: 1px; position: relative; }
.number-cell.active::after { content: ''; position: absolute; top: -6px; right: -6px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF3C4, #F5C542 55%, #C89B2C 100%); border: 1.5px solid var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,0.35); z-index: 2; }
.number-cell:active { transform: scale(0.88); }

/* ===== Duck race ===== */
.race-track { background: linear-gradient(180deg, #1E9AA8, #146B76); border: 4px solid var(--ink); border-radius: 20px; padding: 10px; margin-bottom: 12px; position: relative; overflow: hidden; }
.pond-decor { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.lily-pad { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3FAE6E, #1D7A48); border: 1.5px solid rgba(0,0,0,0.25); opacity: 0.55; }
.lily-pad::after { content: ''; position: absolute; top: 50%; left: 50%; width: 7px; height: 7px; background: inherit; filter: brightness(0.7); clip-path: polygon(0 0, 100% 50%, 0 100%); transform: translate(-15%, -50%); }
.lane { position: relative; height: 46px; border-bottom: 2px dashed rgba(255,255,255,0.3); display: flex; align-items: center; }
.lane:last-child { border-bottom: none; }
.finish-flag { position: absolute; right: 6px; top: 0; bottom: 0; width: 4px; background: repeating-linear-gradient(180deg, var(--gold-bright) 0 6px, var(--ink) 6px 12px); }
.finish-banner { position: absolute; top: -2px; right: 4px; width: 22px; height: 14px;
  background: repeating-conic-gradient(#fff 0deg 90deg, #2B1B12 90deg 180deg); background-size: 8px 8px;
  border: 1.5px solid var(--ink); border-radius: 2px; z-index: 1; box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
.duck-slot { position: absolute; transition: left 0.12s linear; }

/* duck sprite (pure CSS art) */
.duck-sprite-wrap { position: relative; }
.duck-tail { position: absolute; border-radius: 60% 20% 60% 20%; transform: rotate(-15deg); transform-origin: 90% 50%; }
.duck-body { position: absolute; border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%; box-shadow: inset -3px -3px 0 rgba(0,0,0,0.08); }
.duck-shine { position: absolute; background: rgba(255,255,255,0.4); border-radius: 50%; transform: rotate(-20deg); pointer-events: none; }
.duck-wing { position: absolute; border-radius: 50%; transform-origin: 15% 40%; box-shadow: inset -2px -2px 0 rgba(0,0,0,0.1); }
.duck-wing-feather { position: absolute; border-radius: 50%; border-top: 1.5px solid rgba(0,0,0,0.16); background: transparent; }
.duck-head { position: absolute; border-radius: 50%; box-shadow: inset -2px -2px 0 rgba(0,0,0,0.08); }
.duck-brow { position: absolute; height: 2px; border-radius: 2px; background: var(--ink); transform: rotate(-12deg); }
.duck-eye { position: absolute; border-radius: 50%; background: var(--white); border: 1.5px solid var(--ink); }
.duck-eye::after { content: ''; position: absolute; width: 46%; height: 46%; background: var(--ink); border-radius: 50%; top: 27%; left: 27%; }
.duck-beak { position: absolute; border-radius: 0 45% 45% 0 / 0 65% 65% 0; }
.duck-bandana { position: absolute; background: var(--gold); border: 1.5px solid var(--ink); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.duck-bandana::after { content: ''; position: absolute; top: 14%; left: 30%; width: 40%; height: 22%; border-radius: 50%; background: var(--red); }
.duck-leg { position: absolute; border-radius: 50%; }
.duck-ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); animation: ripple-pulse 1.1s ease-out infinite; }
.duck-wake { position: absolute; border-top: 2px solid rgba(255,255,255,0.5); border-radius: 2px; }
@keyframes ripple-pulse { 0% { transform: scale(0.3); opacity: 0.6; } 100% { transform: scale(2.4); opacity: 0; } }
@keyframes duck-wing-flap { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(24deg); } }
@keyframes duck-tail-bob { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(2deg); } }
@keyframes duck-body-bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-3px) rotate(2deg); } }
@keyframes duck-leg-l-swim { 0%,100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(-4px) rotate(-25deg); } }
@keyframes duck-leg-r-swim { 0%,100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(4px) rotate(25deg); } }
@keyframes duck-bandana-flutter { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
@keyframes wake-fade { 0% { opacity: 0.6; transform: scaleX(1); } 100% { opacity: 0; transform: scaleX(0.4); } }
.duck-sprite-wrap.swimming { animation: duck-body-bob 0.5s ease-in-out infinite; }
.duck-sprite-wrap.swimming .duck-wing { animation: duck-wing-flap 0.4s ease-in-out infinite; }
.duck-sprite-wrap.swimming .duck-tail { animation: duck-tail-bob 0.4s ease-in-out infinite; }
.duck-sprite-wrap.swimming .duck-leg-l { animation: duck-leg-l-swim 0.35s ease-in-out infinite; }
.duck-sprite-wrap.swimming .duck-leg-r { animation: duck-leg-r-swim 0.35s ease-in-out infinite; }
.duck-sprite-wrap.swimming .duck-bandana { animation: duck-bandana-flutter 0.3s ease-in-out infinite; }
.duck-sprite-wrap.swimming .duck-wake { animation: wake-fade 0.5s ease-out infinite; }
.duck-sprite-wrap.idle { animation: idle-bob 2.4s ease-in-out infinite; }

.duck-pick-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
.duck-pick { width: 46px; height: 46px; border-radius: 14px; border: 3px solid var(--ink); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.12s ease; }
.duck-pick.selected { background: var(--gold); outline: 3px solid var(--felt-deep); }
.duck-pick:active { transform: scale(0.9); }

/* ===== Penguin ice path (linear "chicken road") ===== */
.ice-path-outer { background: linear-gradient(180deg, #1E9AA8, #146B76); border-radius: 16px; padding: 14px 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 10px; }
.ice-path { display: flex; gap: 5px; align-items: flex-end; min-width: min-content; }
.path-cell { position: relative; flex: 0 0 auto; width: 38px; height: 46px; display: flex; align-items: center; justify-content: center; }
.path-cell.end-cell { width: 40px; font-size: 22px; }
.ice-tile {
  width: 100%; height: 40px; border-radius: 10px; border: 3px solid var(--ink); background: linear-gradient(180deg, #EAF9FF, #C7ECFB);
  display: flex; align-items: center; justify-content: center; font-size: 13px; position: relative;
  box-shadow: 0 3px 0 rgba(43,27,18,0.35); transition: transform 0.15s ease;
}
.ice-tile.crossed { background: linear-gradient(180deg, #DFF7E6, #BDEECB); }
.ice-tile.sunk { background: linear-gradient(180deg, #FFD9DC, #FFB4BA); animation: tile-sink 0.6s ease forwards; }
@keyframes tile-sink { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(10px) rotate(-8deg); opacity: 0.3; } }
.footprint { width: 40%; height: 40%; border-radius: 50%; background: rgba(43,27,18,0.28); }
.multiplier-badge { text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: var(--white); text-shadow: 0 2px 0 rgba(0,0,0,0.22); margin-bottom: 8px; }
.difficulty-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }

/* ===== marquee lights (casino chase bulbs) ===== */
.marquee-lights { display: flex; gap: 7px; justify-content: center; padding: 5px 4px; overflow: hidden; }
.bulb { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; animation: bulb-chase 1.1s linear infinite; }
@keyframes bulb-chase { 0%,100% { opacity: 0.22; transform: scale(0.75); } 50% { opacity: 1; transform: scale(1.2); } }
.marquee-strip { background: var(--felt-dark); }
.board-lights { margin-bottom: 6px; }

/* ===== ambient glow on gold trim ===== */
@keyframes trim-glow { 0%,100% { box-shadow: var(--card-shadow), 0 0 0 rgba(245,197,66,0); } 50% { box-shadow: var(--card-shadow), 0 0 16px 2px rgba(245,197,66,0.45); } }
.board-card { animation: trim-glow 2.6s ease-in-out infinite; }
@keyframes btn-glow { 0%,100% { filter: drop-shadow(0 0 0 rgba(245,197,66,0)); } 50% { filter: drop-shadow(0 0 7px rgba(245,197,66,0.55)); } }
.action-btn:not(:disabled) { animation: btn-glow 2s ease-in-out infinite; }

/* ===== win celebration: shine sweep + glow pulse + flash ===== */
.result-banner.win { position: relative; overflow: hidden; box-shadow: 0 0 0 3px var(--gold-bright); animation: banner-in 0.35s cubic-bezier(.2,1.4,.4,1), win-glow-pulse 1.3s ease-in-out infinite 0.35s; }
.result-banner.win::after {
  content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.75), transparent); transform: skewX(-20deg);
  animation: shine-sweep 2s ease-in-out infinite 0.4s;
}
@keyframes shine-sweep { 0% { left: -60%; } 100% { left: 130%; } }
@keyframes win-glow-pulse { 0%,100% { box-shadow: 0 0 0 3px var(--gold-bright), 0 0 14px 3px rgba(245,197,66,0.5); } 50% { box-shadow: 0 0 0 3px var(--gold-bright), 0 0 28px 9px rgba(245,197,66,0.9); } }
.win-flash { position: absolute; width: 40px; height: 40px; border-radius: 50%; margin-left: -20px; margin-top: -20px; background: radial-gradient(circle, rgba(255,224,138,0.95), rgba(255,224,138,0) 70%); animation: flash-pop 0.7s ease-out forwards; pointer-events: none; }
@keyframes flash-pop { 0% { transform: scale(0.3); opacity: 0.95; } 100% { transform: scale(6); opacity: 0; } }
.confetti-bit.sparkle { border-radius: 50%; box-shadow: 0 0 6px 1px currentColor; }

.coin-bit { position: absolute; font-size: 20px; animation: coin-shower-fall 1.5s cubic-bezier(.3,.6,.4,1) forwards; }
@keyframes coin-shower-fall { 0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; } 70% { opacity: 1; } 100% { transform: translateY(220px) rotate(620deg) scale(0.7); opacity: 0; } }

.mega-flash { position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(255,224,138,0.4), transparent 62%); animation: mega-flash-anim 0.7s ease-out forwards; pointer-events: none; z-index: 998; }
@keyframes mega-flash-anim { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

.big-win-text {
  position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 1001;
  font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: var(--gold-bright);
  text-shadow: 0 3px 0 var(--red-deep), 0 0 24px rgba(245,197,66,0.9); white-space: nowrap;
  animation: big-win-pop 1.3s cubic-bezier(.2,1.6,.4,1) forwards; pointer-events: none;
}
@keyframes big-win-pop {
  0% { transform: translate(-50%, -50%) scale(0.2) rotate(-8deg); opacity: 0; }
  20% { transform: translate(-50%, -50%) scale(1.25) rotate(3deg); opacity: 1; }
  35% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); opacity: 1; }
  80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(0.85) rotate(0deg); opacity: 0; }
}

.jackpot-text {
  position: fixed; top: 36%; left: 50%; transform: translate(-50%, -50%); z-index: 1002;
  font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; white-space: nowrap;
  color: var(--gold-bright); -webkit-text-fill-color: var(--gold-bright);
  background: linear-gradient(180deg, #FFF3C4, var(--gold-bright) 45%, var(--gold-deep));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: jackpot-pop 1.7s cubic-bezier(.2,1.7,.4,1) forwards, jackpot-rainbow-hue 1.1s linear infinite; pointer-events: none;
}
@keyframes jackpot-rainbow-hue {
  0% { filter: drop-shadow(0 3px 0 var(--red-deep)) drop-shadow(0 0 30px rgba(245,197,66,0.9)) hue-rotate(0deg); }
  100% { filter: drop-shadow(0 3px 0 var(--red-deep)) drop-shadow(0 0 30px rgba(245,197,66,0.9)) hue-rotate(360deg); }
}
@keyframes jackpot-pop {
  0% { transform: translate(-50%, -50%) scale(0.2) rotate(-12deg); opacity: 0; }
  16% { transform: translate(-50%, -50%) scale(1.4) rotate(5deg); opacity: 1; }
  28% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); opacity: 1; }
  40% { transform: translate(-50%, -50%) scale(1.12) rotate(2deg); }
  52% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  85% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(0.85) rotate(0deg); opacity: 0; }
}
.jackpot-rays {
  position: fixed; top: 36%; left: 50%; width: 320px; height: 320px; margin-left: -160px; margin-top: -160px;
  background: repeating-conic-gradient(rgba(255,224,138,0.4) 0deg 7deg, transparent 7deg 15deg);
  border-radius: 50%; z-index: 1000; pointer-events: none;
  animation: ray-spin 1.2s linear forwards, ray-fade 1.2s ease-out forwards;
}
@keyframes ray-spin { from { transform: rotate(0deg); } to { transform: rotate(70deg); } }
@keyframes ray-fade { 0% { opacity: 0.9; } 70% { opacity: 0.7; } 100% { opacity: 0; } }
.app.jackpot-shake { animation: shake-screen 0.5s ease; }


/* penguin sprite (pure CSS art) */
.pen-wrap { position: relative; }
.pen-body { position: absolute; background: #1B2A3A; border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%; }
.pen-belly { position: absolute; background: var(--white); border-radius: 50% 50% 60% 60% / 60% 60% 50% 50%; }
.pen-head { position: absolute; background: #1B2A3A; border-radius: 50%; }
.pen-face { position: absolute; background: var(--white); border-radius: 50%; }
.pen-brow { position: absolute; height: 2px; border-radius: 2px; background: var(--ink); }
.pen-eye { position: absolute; background: var(--ink); border-radius: 50%; }
.pen-eye::after { content: ''; position: absolute; width: 35%; height: 35%; background: #fff; border-radius: 50%; top: 12%; left: 12%; }
.pen-cheek { position: absolute; background: rgba(200,32,58,0.28); border-radius: 50%; }
.pen-beak { position: absolute; background: #FF8A3D; border-radius: 20% 20% 60% 60%; }
.pen-flipper { position: absolute; background: #1B2A3A; border-radius: 50% 50% 60% 40%; }
.pen-flipper.left { transform-origin: 85% 10%; animation: pen-flap-l 1.6s ease-in-out infinite; }
.pen-flipper.right { transform-origin: 15% 10%; animation: pen-flap-r 1.6s ease-in-out infinite; }
.pen-foot { position: absolute; background: #FF8A3D; border-radius: 50% 50% 30% 60%; }
.pen-star { position: absolute; font-size: 9px; animation: dizzy-orbit 0.9s linear infinite; }
.pen-sparkle { position: absolute; font-size: 10px; animation: sparkle-ping 0.7s ease-out infinite; }
@keyframes pen-flap-l { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
@keyframes pen-flap-r { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-10deg); } }
@keyframes penguin-idle-bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-2px) rotate(2deg); } }
@keyframes penguin-hop { 0% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(-13px) scale(1.06,0.94); } 55% { transform: translateY(0) scale(0.95,1.06); } 100% { transform: translateY(0) scale(1,1); } }
@keyframes penguin-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 40% { transform: translateY(-5px) rotate(-18deg); } 100% { transform: translateY(16px) rotate(40deg); opacity: 0; } }
@keyframes penguin-happy { 0%,100% { transform: translateY(0) rotate(-5deg); } 25% { transform: translateY(-9px) rotate(5deg); } 50% { transform: translateY(0) rotate(-5deg); } 75% { transform: translateY(-6px) rotate(4deg); } }
@keyframes dizzy-orbit { 0% { transform: rotate(0deg) translateX(16px) rotate(0deg); opacity: 1; } 100% { transform: rotate(360deg) translateX(16px) rotate(-360deg); opacity: 0.7; } }
@keyframes sparkle-ping { 0% { transform: scale(0.4); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
.pen-wrap.state-idle { animation: penguin-idle-bob 2s ease-in-out infinite; }
.pen-wrap.state-hop { animation: penguin-hop 0.45s ease; }
.pen-wrap.state-fall { animation: penguin-fall 0.7s ease forwards; }
.pen-wrap.state-happy { animation: penguin-happy 0.8s ease-in-out infinite; }
.pen-wrap.state-happy .pen-flipper.left { animation: pen-flap-l 0.35s ease-in-out infinite; }
.pen-wrap.state-happy .pen-flipper.right { animation: pen-flap-r 0.35s ease-in-out infinite; }

/* ===== Rocket crash ===== */
.rocket-track { background: linear-gradient(180deg, #1B1730, #351C54); border: 4px solid var(--ink); border-radius: 20px; height: 220px; position: relative; overflow: hidden; margin-bottom: 12px; }
.star { position: absolute; width: 3px; height: 3px; background: rgba(255,255,255,0.7); border-radius: 50%; }
.rocket-sprite { position: absolute; left: 50%; transform: translateX(-50%); transition: bottom 0.05s linear; }
.rocket-body { width: 20px; height: 40px; background: linear-gradient(180deg, var(--white), #DDD); border: 2px solid var(--ink); border-radius: 50% 50% 20% 20%; position: relative; margin: 0 auto; }
.rocket-window { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #3FB8D6; border: 1.5px solid var(--ink); top: 8px; left: 4px; }
.rocket-fin-l, .rocket-fin-r { position: absolute; width: 8px; height: 14px; background: var(--red); border: 2px solid var(--ink); bottom: -2px; }
.rocket-fin-l { left: -7px; border-radius: 60% 0 0 0; }
.rocket-fin-r { right: -7px; border-radius: 0 60% 0 0; }
.rocket-flame { position: absolute; left: 50%; transform: translateX(-50%); bottom: -14px; width: 12px; height: 18px; background: linear-gradient(180deg, var(--gold-bright), var(--red)); border-radius: 0 0 50% 50%; animation: flame-flicker 0.15s ease-in-out infinite alternate; }
@keyframes flame-flicker { 0% { transform: translateX(-50%) scaleY(1) scaleX(1); } 100% { transform: translateX(-50%) scaleY(1.25) scaleX(0.85); } }
.rocket-multiplier { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
.rocket-status { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 12px; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 0.08em; }
.explosion { position: absolute; left: 50%; font-size: 54px; transform: translate(-50%, -50%); animation: explode-pop 0.5s ease; }
@keyframes explode-pop { 0% { transform: translate(-50%,-50%) scale(0.3); opacity: 0; } 50% { transform: translate(-50%,-50%) scale(1.3); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
@keyframes shake-screen { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.rocket-track.crashed { animation: shake-screen 0.4s ease; }

/* ===== Fortune Cards ===== */
.chest-scene { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 14px; min-height: 168px; justify-content: center; }
.chest-wrap { position: relative; width: 90px; height: 74px; }
.chest-wrap.opening { animation: chest-shake 0.15s ease-in-out infinite; }
@keyframes chest-shake { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.chest-glow { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 110px; height: 110px; background: radial-gradient(circle, rgba(245,197,66,0.35), transparent 65%); pointer-events: none; }
.chest-base { position: absolute; bottom: 0; left: 4px; right: 4px; height: 46px; background: linear-gradient(180deg, #8A5A2E, #5C3A1C); border: 3px solid var(--ink); border-radius: 0 0 10px 10px; }
.chest-base::after { content: ''; position: absolute; inset: 5px; border: 2px solid rgba(0,0,0,0.25); border-radius: 4px; }
.chest-lid { position: absolute; top: 6px; left: 0; right: 0; height: 34px; background: linear-gradient(180deg, #A5723E, #7A4A24); border: 3px solid var(--ink); border-radius: 12px 12px 4px 4px; transform-origin: bottom center; }
.chest-wrap.opening .chest-lid { animation: chest-lid-pop 0.15s ease-in-out infinite; }
@keyframes chest-lid-pop { 0%,100% { transform: rotateX(0deg); } 50% { transform: rotateX(-15deg); } }
.chest-lock { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: 16px; height: 18px; background: var(--gold); border: 2.5px solid var(--ink); border-radius: 4px; }
.chest-golden .chest-base { background: linear-gradient(180deg, #FFD966, #C89B2C); }
.chest-golden .chest-lid { background: linear-gradient(180deg, #FFE9A8, #D4A62E); }
.chest-golden .chest-lock { background: radial-gradient(circle at 35% 30%, #FFF3C4, #F5C542); }
.chest-golden .chest-glow { background: radial-gradient(circle, rgba(245,197,66,0.55), transparent 65%); }

.equip-card { background: linear-gradient(180deg, #2E2154, #1B1730); border: 3px solid #000; border-radius: 16px; padding: 16px; margin-bottom: 12px; }

.equip-slot-icon { font-size: 20px; text-align: center; }
.equip-slot-name { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 9px; color: var(--gold-bright); text-align: center; margin-top: 2px; line-height: 1.2; }
.equip-slot-power { font-size: 8px; font-weight: 700; color: rgba(255,255,255,0.6); text-align: center; margin-top: 2px; line-height: 1.25; }
.tcard.tcard-clickable { cursor: pointer; }
.tcard.tcard-equipped { outline: 3px solid var(--gold-bright); outline-offset: 2px; }
.tcard-equip-badge {
  position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--gold-bright); color: var(--ink); border: 1.5px solid var(--ink);

}
.reveal-caption { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 12px; color: var(--white); text-align: center; text-shadow: 0 1px 0 rgba(0,0,0,0.3); max-width: 240px; line-height: 1.4; }
.reveal-caption.idle { color: rgba(255,255,255,0.6); font-weight: 600; }
.reveal-caption.dupe { color: rgba(255,255,255,0.75); }

.tcard {
  position: relative; width: 100%; aspect-ratio: 2/3; border-radius: 14px; border: 3px solid var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding: 8px 4px 6px;
  box-shadow: 0 4px 0 rgba(0,0,0,0.4); overflow: hidden; transition: transform 0.12s ease;
}
.tcard.tcard-big { width: 130px; margin: 0 auto; box-shadow: 0 6px 0 rgba(0,0,0,0.45); animation: tcard-reveal-pop 0.5s cubic-bezier(.2,1.6,.4,1); }
@keyframes tcard-reveal-pop {
  0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
  55% { transform: scale(1.12) rotate(3deg); opacity: 1; }
  75% { transform: scale(0.96) rotate(-1deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.tcard-frame { position: absolute; inset: 5px; border: 2px dashed rgba(0,0,0,0.22); border-radius: 10px; pointer-events: none; }
.tcard-corner { position: absolute; font-size: 9px; opacity: 0.5; color: var(--ink); animation: corner-twinkle 1.8s ease-in-out infinite; }
.tcard-corner.tl { top: 6px; left: 7px; } .tcard-corner.tr { top: 6px; right: 7px; animation-delay: 0.45s; }
.tcard-corner.bl { bottom: 6px; left: 7px; animation-delay: 0.9s; } .tcard-corner.br { bottom: 6px; right: 7px; animation-delay: 1.35s; }
@keyframes corner-twinkle { 0%,100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 0.9; transform: scale(1.15); } }

.tcard-medallion {
  width: 62%; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  border: 3px solid var(--ink); margin-top: 4px; box-shadow: 0 2px 0 rgba(0,0,0,0.3), inset 0 0 0 2px rgba(255,255,255,0.4);
  animation: medallion-bob 2.6s ease-in-out infinite;
}
@keyframes medallion-bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-3px) rotate(3deg); } }
.tcard-icon { font-size: 24px; }
.tcard.tcard-big .tcard-icon { font-size: 42px; }
.tcard-name-banner { background: rgba(255,255,255,0.6); border: 1.5px solid rgba(0,0,0,0.25); border-radius: 7px; padding: 2px 5px; margin-top: 3px; max-width: 94%; }
.tcard-name { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 8.5px; text-align: center; line-height: 1.2; color: var(--ink); }
.tcard.tcard-big .tcard-name { font-size: 13px; }
.tcard.tcard-big .tcard-name-banner { padding: 4px 10px; }
.tcard-rarity-label { font-size: 6.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.6; color: var(--ink); margin-top: auto; padding-top: 3px; }
.tcard.tcard-big .tcard-rarity-label { font-size: 9px; }
.tcard-count { position: absolute; bottom: 4px; right: 6px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 9px; color: var(--ink); background: rgba(255,255,255,0.7); border: 1.5px solid rgba(0,0,0,0.2); border-radius: 6px; padding: 1px 5px; }

.tcard.rarity-common { background: linear-gradient(160deg, #FFF3DA, #F0DFAE); }
.tcard.rarity-common .tcard-medallion { background: radial-gradient(circle at 35% 30%, #FFFDF6, #EDE2C2 75%); }

.tcard.rarity-uncommon { border-color: #0D4E29; background: linear-gradient(160deg, #6BE39A, #1D9457); }
.tcard.rarity-uncommon .tcard-medallion { background: radial-gradient(circle at 35% 30%, #F2FFF6, #BDEECB 75%); }
.tcard.rarity-uncommon .tcard-name-banner { background: rgba(255,255,255,0.75); }

.tcard.rarity-rare { border-color: #2B1E5C; background: linear-gradient(160deg, #C9A8FF, #7B4FE0); position: relative; }
.tcard.rarity-rare .tcard-medallion { background: radial-gradient(circle at 35% 30%, #F7F1FF, #D9C6FF 75%); }
.tcard.rarity-rare .tcard-name-banner { background: rgba(255,255,255,0.78); }
.tcard.rarity-rare::before {
  content: ''; position: absolute; top: 0; left: -70%; width: 40%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent); transform: skewX(-20deg);
  animation: shine-sweep 3s ease-in-out infinite; pointer-events: none; z-index: 2;
}

.tcard.rarity-legendary {
  border-color: #8A6A1C; background: linear-gradient(160deg, #FFE8A0, #F5C542);
  animation: legendary-glow 1.8s ease-in-out infinite;
}
@keyframes legendary-glow {
  0%,100% { box-shadow: 0 4px 0 rgba(0,0,0,0.4), 0 0 10px 2px rgba(245,197,66,0.5); }
  50% { box-shadow: 0 4px 0 rgba(0,0,0,0.4), 0 0 22px 7px rgba(245,197,66,0.95); }
}
.tcard.rarity-legendary .tcard-medallion { background: radial-gradient(circle at 35% 30%, #FFFDF0, #FFE8A0 75%); }
.tcard.rarity-legendary .tcard-name-banner { background: rgba(255,253,246,0.82); }
.tcard.rarity-legendary::before {
  content: ''; position: absolute; top: 0; left: -70%; width: 45%; height: 100%;
  background: linear-gradient(120deg, transparent, #FF3B5C, #FFC93D, #4CD97B, #3DC9E8, #B04FE0, transparent);
  opacity: 0.7; transform: skewX(-20deg);
  animation: shine-sweep 2s ease-in-out infinite; pointer-events: none; z-index: 2;
}
.tcard-burst {
  position: absolute; top: 50%; left: 50%; width: 200%; height: 200%; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(rgba(255,255,255,0.22) 0deg 10deg, transparent 10deg 20deg);
  animation: burst-spin 6s linear infinite; pointer-events: none; z-index: 0;
}
@keyframes burst-spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

.tcard.rarity-mythic {
  border-color: #B04FE0; background: linear-gradient(160deg, #241C40, #0A0616);
  animation: mythic-glow 1.4s ease-in-out infinite;
}
@keyframes mythic-glow {
  0% { box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 14px 3px rgba(255,59,156,0.6); }
  33% { box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 24px 7px rgba(92,107,255,0.75); }
  66% { box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 24px 7px rgba(61,201,232,0.75); }
  100% { box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 14px 3px rgba(255,59,156,0.6); }
}
.tcard.rarity-mythic .tcard-medallion { background: radial-gradient(circle at 35% 30%, #3A2B5C, #1B1030 75%); }
.tcard.rarity-mythic .tcard-name-banner { background: rgba(20,12,35,0.85); }
.tcard.rarity-mythic .tcard-name { color: #FFE9A8; }
.tcard.rarity-mythic .tcard-corner { color: #FFE9A8; }
.tcard.rarity-mythic::before {
  content: ''; position: absolute; top: 0; left: -70%; width: 45%; height: 100%;
  background: linear-gradient(120deg, transparent, #FF3B9C, #FFE08A, #3DC9E8, #B04FE0, transparent);
  opacity: 0.9; transform: skewX(-20deg);
  animation: shine-sweep 1.5s ease-in-out infinite; pointer-events: none; z-index: 2;
}
.tcard.rarity-mythic .tcard-burst {
  background: repeating-conic-gradient(rgba(255,255,255,0.14) 0deg 8deg, transparent 8deg 16deg);
  animation: burst-spin 3.5s linear infinite;
}
.tcard-burst ~ * { position: relative; z-index: 1; }

.tcard.tcard-locked { background: linear-gradient(160deg, #3A3245, #1B1620); border-color: #000; }
.tcard.tcard-locked .tcard-medallion { background: radial-gradient(circle, rgba(255,255,255,0.1), transparent 75%); border-color: rgba(255,255,255,0.25); animation: none; }
.tcard.tcard-locked .tcard-icon { color: rgba(255,255,255,0.4); animation: locked-pulse 2s ease-in-out infinite; display: inline-block; }
@keyframes locked-pulse { 0%,100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.75; transform: scale(1.12); } }
.tcard.tcard-locked .tcard-name, .tcard.tcard-locked .tcard-rarity-label { color: rgba(255,255,255,0.35); }
.tcard.tcard-locked .tcard-name-banner { background: rgba(255,255,255,0.08); }
.tcard.tcard-locked .tcard-corner { opacity: 0.15; animation: none; }

.card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }

/* ===== Empire ===== */
.prestige-star-row { color: var(--gold-bright); letter-spacing: 0.05em; font-size: 13px; text-shadow: 0 1px 0 rgba(0,0,0,0.3); }
.empire-scene {
  position: relative; overflow: hidden; border-radius: 20px; border: 3px solid #000;

}

}
.empire-info-card {

/* ----- Empire decor: per-tier signature elements ----- */

.ed-graffiti { position: absolute; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 10px; opacity: 0.45; }

.ed-string-bulb { position: absolute; width: 9px; height: 11px; border-radius: 50%; top: 8px;

.ed-curtain { position: absolute; top: -6px; width: 40px; height: 46px; background: radial-gradient(ellipse at top, var(--velvet), #3A0D1E);

.ed-curtain.left { left: -6px; } .ed-curtain.right { right: -6px; transform: scaleX(-1); }

.ed-chand-wire { position: absolute; width: 2px; height: 14px; left: 50%; top: 0; transform: translateX(-50%); background: #050505; }

.ed-floor { position: absolute; bottom: 0; left: 0; right: 0; height: 12px;

.ed-pillar { position: absolute; top: 0; bottom: 12px; width: 7px; background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-deep)); border: 1.5px solid #000; }
.ed-pillar.left { left: 3px; } .ed-pillar.right { right: 3px; }
.ed-pillar.thick { width: 11px; }

.ed-stanchion { position: absolute; bottom: 16px; width: 5px; height: 20px; background: var(--gold); border: 1.5px solid #000; border-radius: 2px; }
.ed-stanchion.left { left: 26px; } .ed-stanchion.right { right: 26px; }
.ed-rope { position: absolute; bottom: 33px; left: 31px; right: 31px; height: 3px; background: var(--red); border-radius: 2px; }

.ed-skyline { position: absolute; bottom: 0; left: 0; right: 0; height: 38%; display: flex; align-items: flex-end; gap: 3px; padding: 0 4px; }
.ed-building { background: #0D1526; border-top: 2px solid rgba(255,255,255,0.12); flex: 1; position: relative; }
.ed-window { position: absolute; width: 3px; height: 3px; background: rgba(255,224,138,0.75); }

.ed-railing { position: absolute; bottom: 38%; left: 8px; right: 8px; height: 2px; background: rgba(200,230,255,0.35); }

.ed-firework { position: absolute; width: 4px; height: 4px; border-radius: 50%; animation: firework-burst 2.6s ease-out infinite; }
@keyframes firework-burst { 0% { transform: scale(0); opacity: 1; } 55% { opacity: 0.75; } 100% { transform: scale(13); opacity: 0; } }

.ed-patron { position: absolute; bottom: 10px; width: 12px; }

.ed-patron.fancy .ed-patron-head::after { content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%); width: 10px; height: 4px; background: rgba(0,0,0,0.38); border-radius: 2px 2px 0 0; }

.ed-cat { position: absolute; bottom: 5px; left: 62%; width: 16px; height: 9px; }

.ed-cat-ear.l { left: 1px; } .ed-cat-ear.r { left: 8px; }

.ed-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 16px; background: linear-gradient(180deg, #4A2E1A, #2E1B10); border-top: 2px solid var(--gold-deep); }
.ed-bottle { position: absolute; bottom: 14px; width: 4px; height: 10px; background: var(--gold); border-radius: 1px 1px 0 0; opacity: 0.8; }

.ed-wheel-accent { position: absolute; top: 8%; right: 8%; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--gold); opacity: 0.5; }
.ed-wheel-accent::after { content: ''; position: absolute; inset: 45% 0; height: 10%; background: var(--gold); } 
.ed-wheel-accent::before { content: ''; position: absolute; inset: 0 45%; width: 10%; background: var(--gold); }

.ed-champagne { position: absolute; bottom: 12px; left: 10%; }
.ed-champagne-glass { width: 6px; height: 6px; border-radius: 0 0 50% 50%; background: rgba(255,224,138,0.55); border: 1px solid var(--gold); margin: 1px auto; }

.ed-moon { position: absolute; top: 8%; right: 10%; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFDF0, #E8DCC0); box-shadow: 0 0 16px 4px rgba(255,253,240,0.4); }

.empire-tier-badge {
  display: inline-block; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink); background: var(--gold); border: 2px solid var(--ink);
  border-radius: 10px; padding: 4px 10px; margin-bottom: 8px;
}
.empire-tier-name { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: var(--white); text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
.empire-tier-desc { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.7); margin-top: 4px; max-width: 260px; margin-left: auto; margin-right: auto; line-height: 1.4; }
.empire-ladder { display: flex; justify-content: center; gap: 6px; margin: 16px 0; }
.empire-rung {
  width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25);

.empire-rung.done { background: var(--gold); border-color: var(--ink); color: var(--ink); }
.empire-rung.current { box-shadow: 0 0 10px 3px rgba(245,197,66,0.7); transform: scale(1.15); animation: point-pulse 1.6s ease-in-out infinite; }
.empire-next-card { background: rgba(0,0,0,0.22); border: 2px dashed rgba(255,255,255,0.3); border-radius: 14px; padding: 14px; margin-top: 6px; position: relative; overflow: hidden; }
.empire-next-card::before {
  content: ''; position: absolute; top: 0; left: -70%; width: 40%; height: 100%;

.empire-maxed { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 13px; color: var(--gold-bright); margin-top: 10px; }

/* ===== Casino Building Exterior ===== */
.empire-building-scene {
  position: relative; overflow: hidden; border-radius: 20px; border: 3px solid #000;
  background:
    radial-gradient(ellipse 90% 55% at 50% 100%, rgba(245,197,66,0.22), transparent 65%),
    linear-gradient(180deg, #1A1030 0%, #140C24 35%, #0A0814 70%, #050308 100%);
  padding: 24px 10px 0; text-align: center;
  min-height: 62vh; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
}
.eb-star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: corner-twinkle 2.6s ease-in-out infinite; }
.cb-wrap { display: flex; flex-direction: column; align-items: center; position: relative; transform: scale(1.35); transform-origin: bottom center; margin-bottom: 6px; }
.cb-door-glow { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: 70px; height: 40px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,201,110,0.5), transparent 70%); z-index: 0; pointer-events: none; }
.cb-spotlight { position: absolute; bottom: 60px; width: 3px; height: 110px; background: linear-gradient(0deg, rgba(255,255,255,0.55), transparent); z-index: 0; }
.cb-spotlight.left { left: -14px; transform: rotate(-18deg); transform-origin: bottom; animation: spotlight-sway 4s ease-in-out infinite; }
.cb-spotlight.right { right: -14px; transform: rotate(18deg); transform-origin: bottom; animation: spotlight-sway 4s ease-in-out infinite reverse; }
@keyframes spotlight-sway { 0%,100% { opacity: 0.5; } 50% { opacity: 0.9; } }
.cb-sign-wrap { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; position: relative; z-index: 2; }
.cb-marquee { display: flex; gap: 2px; padding: 5px 8px; border: 2.5px solid #000; border-radius: 4px; background: #1B1420; }
.cb-letter { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 13px; width: 15px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 2px; }
.cb-marquee-broken .cb-letter, .cb-marquee-fixed .cb-letter { background: #3A2E1A; color: #E8D9B5; border: 1px solid #000; }
.cb-marquee-broken .cb-letter.off { background: #17130E; color: #45392A; box-shadow: none; }
.cb-marquee-broken .cb-letter:not(.off) { animation: bulb-sputter 3s ease-in-out infinite; }
@keyframes bulb-sputter { 0%, 88%, 100% { opacity: 1; } 90% { opacity: 0.35; } 92% { opacity: 1; } 94% { opacity: 0.5; } }

.cb-marquee-marquee .cb-letter { background: var(--gold-bright); color: var(--ink); box-shadow: 0 0 12px 3px rgba(245,197,66,0.7); animation: point-pulse 1.8s ease-in-out infinite; }
.cb-marquee-marquee-gold .cb-letter { background: linear-gradient(180deg, #FFE9A8, var(--gold-deep)); color: var(--ink); box-shadow: 0 0 16px 4px rgba(245,197,66,0.8); animation: point-pulse 1.5s ease-in-out infinite; border-color: var(--gold-bright); }
.cb-marquee-neon { background: #0A0812; }

@keyframes neon-flicker { 0%, 92%, 100% { opacity: 1; } 94% { opacity: 0.6; } 96% { opacity: 1; } 98% { opacity: 0.75; } }
.cb-building { background: linear-gradient(180deg, #6B5236, #3D2C18); border: 3px solid #000; border-radius: 6px 6px 0 0; display: flex; flex-direction: column-reverse; overflow: hidden; position: relative; z-index: 1; box-shadow: inset 0 0 20px rgba(0,0,0,0.4); }

.cb-floor { display: flex; justify-content: center; gap: 6px; padding: 6px 8px; border-top: 1px solid rgba(245,197,66,0.35); }
.cb-roof-lights { display: flex; justify-content: center; gap: 5px; padding: 3px 0; }
.cb-roof-bulb { width: 5px; height: 5px; border-radius: 50%; background: radial-gradient(circle, #FFE9A8, #C89B2C); box-shadow: 0 0 5px 2px rgba(255,224,138,0.6); animation: bulb-chase 1.4s linear infinite; }
.cb-window { width: 10px; height: 12px; background: #10121A; border: 1px solid #000; }
.cb-window.lit { background: radial-gradient(circle, #FFE9A8, #C89B2C); box-shadow: 0 0 4px 1px rgba(255,224,138,0.55); }
.cb-ground { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.cb-awning { width: 60px; height: 9px; background: repeating-linear-gradient(90deg, var(--red) 0 8px, var(--white) 8px 16px); border: 2px solid #000; border-radius: 2px 2px 0 0; }
.cb-canopy { width: 90px; height: 8px; background: var(--gold); border: 2px solid #000; }
.cb-carpet { width: 26px; height: 14px; background: var(--red); border: 1.5px solid #000; border-top: none; }
.cb-door { width: 18px; height: 22px; background: linear-gradient(180deg, #3A2410, #1B1008); border: 2px solid var(--gold-deep); border-radius: 3px 3px 0 0; position: relative; z-index: 1; }
.cb-mat { width: 26px; height: 6px; background: #8A5A2E; border: 1.5px solid #000; border-radius: 2px; margin-bottom: -2px; }
.cb-crack { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 140px; height: 6px; }
.cb-crack::before, .cb-crack::after { content: ''; position: absolute; height: 1.5px; background: rgba(0,0,0,0.4); }
.cb-crack::before { width: 60px; left: 0; top: 2px; transform: rotate(4deg); }
.cb-crack::after { width: 50px; right: 0; top: 0; transform: rotate(-6deg); }
.cb-junker { position: absolute; bottom: 2px; left: -40px; width: 30px; height: 12px; }
.cb-junker-body { position: absolute; bottom: 4px; width: 30px; height: 8px; background: #6B2E2E; border: 1.5px solid #000; border-radius: 4px 4px 1px 1px; opacity: 0.8; }
.cb-junker-wheel { position: absolute; bottom: 0; width: 6px; height: 6px; border-radius: 50%; background: #1B1420; border: 1px solid #000; }
.cb-junker-wheel.l { left: 3px; } .cb-junker-wheel.r { right: 3px; }

.cb-antenna { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); width: 2px; height: 30px; background: #2B1B12; z-index: 2; }
.cb-antenna-light { position: absolute; top: -4px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px 3px rgba(200,32,58,0.8); animation: antenna-blink 1.6s ease-in-out infinite; }
@keyframes antenna-blink { 0%, 40%, 100% { opacity: 1; } 20% { opacity: 0.25; } }
.cb-sparkle-field { position: absolute; inset: -20px 0 0; pointer-events: none; z-index: 0; }
.cb-gold-sparkle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: radial-gradient(circle, #FFF3C4, var(--gold-bright)); box-shadow: 0 0 6px 2px rgba(245,197,66,0.7); animation: firework-burst 3s ease-out infinite; }
.cb-limo { position: absolute; bottom: 2px; right: -56px; width: 48px; height: 14px; }
.cb-limo-body { position: absolute; bottom: 4px; width: 48px; height: 9px; background: linear-gradient(180deg, #1B1420, #0A0812); border: 1.5px solid var(--gold-deep); border-radius: 4px 6px 1px 1px; }
.cb-limo-window { position: absolute; bottom: 7px; left: 8px; width: 26px; height: 4px; background: rgba(180,210,230,0.35); border-radius: 2px; }
.cb-limo-wheel { position: absolute; bottom: 0; width: 6px; height: 6px; border-radius: 50%; background: #0A0812; border: 1px solid var(--gold-deep); }
.cb-limo-wheel.l { left: 8px; } .cb-limo-wheel.r { right: 8px; }

/* ===== Prestige Skill Tree ===== */
.tree-header { text-align: center; padding: 10px 0 18px; position: relative; }
.tree-title {
  font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 25px; display: inline-block;
  background: linear-gradient(100deg, var(--gold-bright) 35%, #FFFFFF 50%, var(--gold-bright) 65%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,0.4));
  animation: wordmark-shine 3.2s ease-in-out infinite;
}
.tree-subtitle { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.65); margin-top: 4px; }
.tree-star-count { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; color: var(--gold-bright); margin-top: 8px; text-shadow: 0 0 10px rgba(245,197,66,0.7); animation: point-pulse-text 1.8s ease-in-out infinite; }
@keyframes point-pulse-text { 0%,100% { text-shadow: 0 0 8px rgba(245,197,66,0.5); } 50% { text-shadow: 0 0 16px rgba(245,197,66,0.95); } }
.tree-progress { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
.tree-progress-bar { width: 110px; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.25); overflow: hidden; }
.tree-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold-bright)); transition: width 0.4s ease; }
.tree-progress-label { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 10.5px; color: rgba(255,255,255,0.7); }
.tree-scene {
  position: relative; overflow: hidden; border-radius: 20px; border: 3px solid #000;
  background: linear-gradient(180deg, #2E2154, #1B1730); padding: 6px 10px 18px;
}
.tree-sparkle-field { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.tree-sparkle { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #FFE9A8; box-shadow: 0 0 4px 1px rgba(255,233,168,0.8); animation: corner-twinkle 2.3s ease-in-out infinite; }
.tree-branches { display: flex; justify-content: space-around; gap: 2px; position: relative; z-index: 1; }
.tree-branch { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; }
.tree-branch-name { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 8.5px; color: rgba(255,255,255,0.7); text-align: center; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 8px; line-height: 1.2; padding: 0 1px; }
.tree-node {
  width: 52px; height: 52px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 2.5px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); cursor: pointer; position: relative; overflow: hidden;
  transition: transform 0.15s ease; flex-shrink: 0;
}
.tree-node-icon { font-size: 18px; opacity: 0.35; position: relative; z-index: 1; }
.tree-node-cost { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 9px; color: rgba(255,255,255,0.5); margin-top: 1px; position: relative; z-index: 1; }
.tree-node.available { background: rgba(245,197,66,0.18); border-color: var(--gold); animation: point-pulse 1.6s ease-in-out infinite; cursor: pointer; }
.tree-node.available .tree-node-icon { opacity: 1; }
.tree-node.available .tree-node-cost { color: var(--gold-bright); }
.tree-node.available::before {
  content: ''; position: absolute; top: 0; left: -80%; width: 45%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.65), transparent); transform: skewX(-20deg);
  animation: shine-sweep 2.2s ease-in-out infinite; z-index: 0;
}
.tree-node.owned { background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep)); border-color: var(--ink); box-shadow: 0 0 10px 3px rgba(245,197,66,0.55); }
.tree-node.owned .tree-node-icon { opacity: 1; }
.tree-node.owned .tree-node-cost { display: none; }
.tree-node.owned::before {
  content: ''; position: absolute; top: 0; left: -80%; width: 35%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent); transform: skewX(-20deg);
  animation: shine-sweep 3.6s ease-in-out infinite; z-index: 0;
}
.tree-node.locked { cursor: not-allowed; opacity: 0.55; }
.tree-node.just-bought { animation: node-pop 0.6s cubic-bezier(.2,1.7,.4,1); }
@keyframes node-pop {
  0% { transform: scale(1); }
  35% { transform: scale(1.4) rotate(-6deg); box-shadow: 0 0 24px 10px rgba(245,197,66,0.9); }
  65% { transform: scale(0.92) rotate(3deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.tree-line { width: 3px; height: 22px; background: rgba(255,255,255,0.2); transition: background 0.4s ease; }
.tree-line.lit { background: var(--gold); box-shadow: 0 0 6px 1px rgba(245,197,66,0.6); }
.tree-node-name { font-size: 7.5px; font-weight: 800; color: rgba(255,255,255,0.7); text-align: center; margin-top: 4px; max-width: 62px; line-height: 1.15; }
.tree-node-tooltip { font-size: 8px; font-weight: 700; color: rgba(255,255,255,0.55); text-align: center; margin-top: 2px; max-width: 64px; line-height: 1.2; min-height: 30px; }
.tree-continue-btn { margin-top: 16px; }
.legacy-crown { margin-left: 2px; filter: drop-shadow(0 1px 0 rgba(0,0,0,0.4)); animation: medallion-bob 3s ease-in-out infinite; display: inline-block; }

/* ===== Craps ===== */
.craps-table { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; }
.craps-point-track { display: flex; gap: 5px; background: rgba(0,0,0,0.22); border: 2px solid rgba(0,0,0,0.35); border-radius: 10px; padding: 6px; }
.craps-point-box {
  width: 30px; height: 30px; border-radius: 7px; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.25);
  display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 13px;
  color: rgba(255,255,255,0.65); transition: all 0.25s ease;
}
.craps-point-box.lit { background: var(--gold); border-color: var(--ink); color: var(--ink); box-shadow: 0 0 10px 3px rgba(245,197,66,0.7); transform: scale(1.12); animation: point-pulse 1.4s ease-in-out infinite; }
@keyframes point-pulse { 0%,100% { box-shadow: 0 0 10px 3px rgba(245,197,66,0.7); } 50% { box-shadow: 0 0 16px 5px rgba(245,197,66,0.95); } }
.craps-puck { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(180deg, #2B2B33, var(--ink)); color: var(--white); border: 3px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 10.5px; box-shadow: 0 3px 0 rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.15); transition: all 0.3s ease; }
.craps-puck.on { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: var(--ink); border-color: var(--ink); transform: rotateY(360deg); }
.dice-tray { background: rgba(0,0,0,0.18); border-radius: 14px; padding: 12px 20px; border: 2px dashed rgba(255,255,255,0.2); }
.dice-row { display: flex; gap: 14px; }
.die { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 3px; background: var(--white); border: 2.5px solid var(--ink); border-radius: 9px; padding: 6px; box-shadow: 0 3px 0 rgba(0,0,0,0.3); }
.die-pip { border-radius: 50%; background: transparent; }
.die-pip.on { background: var(--ink); }
.die-rolling { animation: die-tumble 0.5s ease-in-out; }
@keyframes die-tumble { 0% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(110deg) scale(1.12); } 50% { transform: rotate(200deg) scale(0.92); } 75% { transform: rotate(300deg) scale(1.08); } 100% { transform: rotate(360deg) scale(1); } }
.craps-status { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 12px; color: rgba(255,255,255,0.85); text-align: center; text-shadow: 0 1px 0 rgba(0,0,0,0.3); }
.craps-history { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 220px; }
.craps-history-dot { width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,0.16); border: 1.5px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.75); font-size: 9px; font-weight: 700; font-family: 'Fredoka', sans-serif; display: flex; align-items: center; justify-content: center; animation: card-deal 0.25s ease; }
.pass-line { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); border: 2px dashed rgba(245,197,66,0.5); border-radius: 10px; padding: 5px 12px; }
.pass-line-label { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: 0.08em; color: rgba(255,255,255,0.6); }
.pass-line-chip { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 13px; color: var(--gold-bright); }

/* ===== Plinko ===== */
.plinko-board { background: linear-gradient(180deg, #1B1730, #120E22); border: 3px solid var(--ink); border-radius: 16px; padding: 14px 6px 6px; position: relative; height: 210px; overflow: hidden; }
.plinko-peg-row { display: flex; justify-content: space-evenly; align-items: center; margin-bottom: 12px; padding: 0 4px; }
.plinko-peg { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 4px rgba(245,197,66,0.6); flex-shrink: 0; }
.plinko-chip { position: absolute; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; background: radial-gradient(circle at 35% 30%, #FFE9A8, #C89B2C); border: 2px solid var(--ink); transition: left 0.13s ease, top 0.13s linear; z-index: 5; box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
.plinko-slots { display: flex; gap: 2px; margin-top: 8px; }
.plinko-slot { flex: 1; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 9px; padding: 6px 0; border-radius: 5px; border: 2px solid var(--ink); color: var(--ink); transition: transform 0.2s ease; }
.plinko-slot-0, .plinko-slot-8 { background: linear-gradient(180deg, #FF7A96, #FF3B5C); color: var(--white); box-shadow: 0 0 8px 1px rgba(255,59,92,0.5); }
.plinko-slot-1, .plinko-slot-7 { background: linear-gradient(180deg, #FFB07A, #FF7A3D); color: var(--white); }
.plinko-slot-2, .plinko-slot-6 { background: linear-gradient(180deg, #FFE07A, #FFC93D); }
.plinko-slot-3, .plinko-slot-5 { background: linear-gradient(180deg, #8FEDB0, #4CD97B); }
.plinko-slot-4 { background: linear-gradient(180deg, #8AE4F5, #3DC9E8); color: var(--white); }
.plinko-slot.landed { transform: translateY(-4px) scale(1.15); box-shadow: 0 0 14px 4px rgba(245,197,66,0.85); z-index: 2; }

/* ===== Blackjack ===== */
.dealer-scene { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
.dealer-wrap { position: relative; width: 64px; height: 76px; flex-shrink: 0; animation: shark-sway 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.35)); }
.dealer-body { position: absolute; left: 8%; top: 56%; width: 84%; height: 44%; border-radius: 22% 22% 12% 12%; background: #1B1B22; border: 2px solid var(--ink); }
.dealer-shirt { position: absolute; left: 32%; top: 58%; width: 36%; height: 26%; background: var(--white); border: 2px solid var(--ink); clip-path: polygon(10% 0, 90% 0, 70% 100%, 30% 100%); }
.dealer-bowtie { position: absolute; left: 41%; top: 60%; width: 18%; height: 9%; background: var(--red); border: 1.5px solid var(--ink); clip-path: polygon(0 0, 45% 50%, 0 100%, 100% 100%, 55% 50%, 100% 0); }
.dealer-head { position: absolute; left: 22%; top: 10%; width: 56%; height: 48%; border-radius: 50%; background: #E0B48C; border: 2px solid var(--ink); }
.dealer-eye { position: absolute; width: 7%; height: 7%; border-radius: 50%; background: var(--ink); top: 36%; }
.dealer-eye.l { left: 33%; } .dealer-eye.r { left: 60%; }
.dealer-visor { position: absolute; left: 16%; top: 8%; width: 68%; height: 18%; background: var(--felt); border: 2px solid var(--ink); border-radius: 50% 50% 0 0; }
.dealer-visor-band { position: absolute; left: 12%; top: 22%; width: 76%; height: 7%; background: var(--felt-deep); border: 2px solid var(--ink); border-radius: 4px; }

.hand-label { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 11px; color: rgba(255,255,255,0.85); text-align: center; margin: 8px 0 6px; text-transform: uppercase; letter-spacing: 0.06em; text-shadow: 0 1px 0 rgba(0,0,0,0.3); }
.card-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 64px; }
.pcard { width: 42px; height: 60px; border-radius: 6px; border: 2.5px solid var(--ink); background: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,0.3); font-family: 'Fredoka', sans-serif; font-weight: 700; flex-shrink: 0; animation: card-deal 0.28s ease; }
.pcard.red { color: var(--red); }
.pcard.black { color: var(--ink); }
.pcard-rank { font-size: 15px; line-height: 1; }
.pcard-suit { font-size: 15px; line-height: 1; margin-top: 2px; }
.pcard.back { background: repeating-linear-gradient(45deg, var(--felt) 0 6px, var(--felt-deep) 6px 12px); }
@keyframes card-deal { 0% { transform: translateY(-14px) rotate(-6deg); opacity: 0; } 100% { transform: translateY(0) rotate(0deg); opacity: 1; } }
.pcard.flip-reveal { animation: card-flip-reveal 0.45s ease; }
@keyframes card-flip-reveal { 0% { transform: rotateY(180deg); } 50% { transform: rotateY(90deg); background: var(--felt-deep); } 100% { transform: rotateY(0deg); } }
.bj-felt-texture { position: absolute; inset: 0; pointer-events: none; opacity: 0.5; border-radius: inherit;
  background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.08) 0 2px, transparent 2px 26px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.08) 0 2px, transparent 2px 26px); }
.bj-suit-watermark { position: absolute; font-size: 30px; color: rgba(255,255,255,0.08); pointer-events: none; }

/* ===== Slots ===== */
.slot-machine {
  background: linear-gradient(180deg, #8F1228, #5C1626 55%, #3A0D18);
  border: 5px solid var(--ink); border-radius: 22px; padding: 16px 14px 18px; position: relative; margin-top: 4px;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 6px 0 rgba(0,0,0,0.35);
}
.slot-marquee {
  background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep)); border: 3px solid var(--ink); border-radius: 12px;
  padding: 5px 8px; text-align: center; position: relative; overflow: hidden; margin-bottom: 8px;
}
.slot-marquee-text { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 12px; color: var(--ink); letter-spacing: 0.1em; text-transform: uppercase; }
.slot-display {
  background: #0A0A0A; border: 3px solid var(--gold-deep); border-radius: 8px; padding: 7px 10px; text-align: center;
  font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; margin-bottom: 10px;
  color: #FF4D4D; text-shadow: 0 0 8px rgba(255,77,77,0.85); transition: color 0.2s ease, text-shadow 0.2s ease;
}
.slot-display.win-glow { color: #7CFF6B; text-shadow: 0 0 10px rgba(124,255,107,0.9); }
.slot-frame {
  border: 5px solid; border-image: linear-gradient(135deg, #FFE08A, #C89B2C 35%, #7A5A18 60%, #C89B2C 85%, #FFE08A) 1;
  border-radius: 16px; padding: 4px; background: rgba(0,0,0,0.2);
}
.slot-grid { display: flex; gap: 6px; justify-content: center; background: #100C18; border-radius: 12px; padding: 10px 8px; position: relative; box-shadow: inset 0 4px 10px rgba(0,0,0,0.6); }
.slot-payline { position: absolute; left: 6px; right: 6px; top: 50%; height: 3px; background: repeating-linear-gradient(90deg, var(--red) 0 7px, transparent 7px 14px); transform: translateY(-50%); z-index: 3; pointer-events: none; opacity: 0.9; box-shadow: 0 0 6px 1px rgba(200,32,58,0.6); }

const HEAT_STOPS = [
  [0.00, [79, 184, 204]],
  [0.25, [76, 217, 123]],
  [0.50, [245, 197, 66]],
  [0.75, [255, 122, 61]],
  [1.00, [255, 59, 92]],
];
function heatColor(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < HEAT_STOPS.length - 1; i++) {
    const t0 = HEAT_STOPS[i][0], c0 = HEAT_STOPS[i][1];
    const t1 = HEAT_STOPS[i + 1][0], c1 = HEAT_STOPS[i + 1][1];
    if (t >= t0 && t <= t1) {
      const f = t1 === t0 ? 0 : (t - t0) / (t1 - t0);
      const r = Math.round(c0[0] + (c1[0] - c0[0]) * f);
      const g = Math.round(c0[1] + (c1[1] - c0[1]) * f);
      const b = Math.round(c0[2] + (c1[2] - c0[2]) * f);
      return "rgb(" + r + "," + g + "," + b + ")";
    }
  }
  const last = HEAT_STOPS[HEAT_STOPS.length - 1][1];
  return "rgb(" + last[0] + "," + last[1] + "," + last[2] + ")";
}

function bankrollLevel(maxWallet) {
  let idx = 0;
  for (let i = 0; i < BANKROLL_LEVELS.length; i++) {
    if (maxWallet >= BANKROLL_LEVELS[i].threshold) idx = i;
  }
  const current = BANKROLL_LEVELS[idx];
  const next = BANKROLL_LEVELS[idx + 1] || null;
  return { index: idx, name: current.name, next: next };
}
